[package]
name = "rust-image-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "gif", "webp"] }
egui_extras = { version = "0.36", features = ["image", "file"] }
icrate = "0.1"
kamadak-exif = "0.6.1"
